<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Stock Opname • Tigalapan</title><link rel="stylesheet" href="./style.css"></head><body>
<header><div><span class="brand">TIGALAPAN INDONESIA</span><h1>Stock Opname</h1></div><div id="session-info" hidden><span id="account"></span><button id="password-change" class="subtle">Ubah password</button><button id="logout" class="subtle">Keluar</button></div></header>
<main id="auth"><section class="panel login"><h2>Masuk ke sistem</h2><p>Gunakan akun Stock Opname Anda.</p><form id="login-form"><label>Username<input id="username" autocomplete="username" required maxlength="120"></label><label>Password<input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button>Masuk</button></form></section></main>
<div id="shell" hidden><nav id="nav" aria-label="Menu aplikasi"></nav><main id="content"><div id="mode-note" class="notice"></div><div class="page-heading"><div><h2 id="page-title"></h2><p id="page-description" class="muted"></p></div><div id="page-actions" class="actions"></div></div><section id="filters" class="panel filters"><label>Toko<select id="store-filter"></select></label><label>Status<select id="status-filter"></select></label><label>Tahun<input id="year-filter" placeholder="Semua tahun" inputmode="numeric" maxlength="4"></label><label>Cari<input id="search-filter" placeholder="Nomor SO, SKU, atau nama"></label><button id="apply">Terapkan</button><button id="reset" class="secondary">Reset</button></section><div id="view"></div><div id="pagination" class="actions"><button id="first" class="secondary">Halaman pertama</button><button id="next">Berikutnya</button></div></main></div>
<section id="setup" class="panel login" hidden><h2>Siapkan data kerja</h2><p>Salinan awal tetap menjadi cadangan. Impor ini menyiapkan seluruh tabel untuk pengujian terpadu.</p><p id="setup-progress"></p><button id="setup-start">Mulai / lanjutkan impor</button></section>
<div id="message" role="status" aria-live="polite"></div><dialog id="editor"><form id="edit-form"><h2 id="editor-title"></h2><div id="editor-fields" class="form-grid"></div><div class="actions"><button type="submit">Simpan</button><button type="button" id="editor-cancel" class="secondary">Batal</button></div></form></dialog>
<dialog id="so-dialog"><div class="page-heading"><div><h2 id="so-title"></h2><p id="so-info" class="muted"></p></div><button id="so-close" class="secondary">Tutup</button></div><div id="so-actions" class="actions"></div><div id="so-content"></div><div class="actions"><button id="so-first" class="secondary">Halaman pertama</button><button id="so-next">Berikutnya</button><button id="so-save">Simpan perubahan halaman ini</button></div><div id="so-files" class="actions"></div></dialog>
<dialog id="signature-dialog"><h2>Tanda tangan BA</h2><p id="signature-level"></p><canvas id="signature-canvas" width="600" height="180" aria-label="Area tanda tangan"></canvas><div class="actions"><button id="signature-clear" class="secondary">Bersihkan</button><button id="signature-save">Simpan tanda tangan</button><button id="signature-cancel" class="secondary">Batal</button></div></dialog>
<dialog id="password-dialog"><form id="password-form"><h2>Ubah password</h2><label>Password saat ini<input type="password" name="oldPassword" autocomplete="current-password" required maxlength="1024"></label><label>Password baru<input type="password" name="newPassword" autocomplete="new-password" required minlength="8" maxlength="1024"></label><label>Konfirmasi password baru<input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8" maxlength="1024"></label><div class="actions"><button type="submit">Simpan password</button><button type="button" id="password-cancel" class="secondary">Batal</button></div></form></dialog>
<script src="./config.js"></script><script src="./app.js"></script></body></html>
